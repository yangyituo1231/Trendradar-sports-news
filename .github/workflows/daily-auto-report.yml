name: Daily Auto Report


on:

  schedule:

    # 北京时间每天8点
    # UTC 0点
    - cron: '0 0 * * *'


  workflow_dispatch:



env:

  TZ: Asia/Shanghai



permissions:

  contents: write
  pages: write
  id-token: write



jobs:


  auto-report:


    runs-on: ubuntu-latest



    steps:


      # =========================
      # Checkout
      # =========================

      - name: Checkout repository

        uses: actions/checkout@v4



      # =========================
      # Python
      # =========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # =========================
      # Dependencies
      # =========================

      - name: Install dependencies

        run: |

          pip install \
            requests \
            beautifulsoup4 \
            pyyaml \
            lxml \
            pillow \
            playwright \
            openai \
            python-pptx \
            pandas



      # =========================
      # 浏览器环境
      # 周报图片需要
      # =========================

      - name: Install browser

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-wqy-zenhei \
            fontconfig


          sudo fc-cache -fv


          playwright install --with-deps chromium




      # =========================
      # 数据抓取
      # =========================

      - name: Fetch News

        run: |

          python scripts/get_hot_news.py



      - name: Fetch Weather

        run: |

          python scripts/get_weather.py





      # =========================
      # 日报生成
      # =========================

      - name: Generate Daily Report

        env:

          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |

          python scripts/fill_report.py





      # =========================
      # 周报数据
      # =========================

      - name: Generate Weekly Data

        run: |

          python scripts/generate_weekly.py



      - name: Generate Products Data

        run: |

          python scripts/get_products.py



      - name: Generate Product Signals

        run: |

          python scripts/get_product_signals.py



      - name: Analyze Weekly Data

        env:

          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |

          python scripts/analyze_weekly.py





      # =========================
      # 周报HTML
      # =========================

      - name: Generate Weekly HTML

        run: |

          python scripts/generate_weekly_html.py




      # =========================
      # 周报图片
      # =========================

      - name: Render Weekly Image

        run: |

          python scripts/render_weekly_report.py





      # =========================
      # 准备Pages网页
      # =========================

      - name: Prepare Pages

        run: |

          mkdir -p docs



          # 日报

          cp daily-report-filled.html docs/daily-report.html || true

          cp output/daily-report-filled.html docs/daily-report.html || true



          # 周报

          cp output/weekly/weekly_report.html docs/weekly-report.html || true



          # 图片

          cp weekly-report.png docs/weekly-report.png || true



          # 首页

          cat > docs/index.html <<EOF

          <html>

          <head>

          <meta charset="utf-8">

          <title>运动鞋服行业资讯</title>

          </head>


          <body>


          <h1>运动鞋服行业资讯</h1>


          <h2>

          <a href="./daily-report.html">

          日报

          </a>

          </h2>


          <h2>

          <a href="./weekly-report.html">

          周报

          </a>

          </h2>


          <img src="./weekly-report.png" width="500">


          </body>


          </html>

          EOF





      # =========================
      # 上传Pages
      # =========================

      - name: Upload Pages Artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: docs





      # =========================
      # 发布Pages
      # =========================

      - name: Deploy Pages

        uses: actions/deploy-pages@v4





      # =========================
      # 保存代码
      # =========================

      - name: Commit files

        run: |


          git config user.name github-actions

          git config user.email github-actions@github.com


          git add .


          git commit -m "auto update report" || echo "nothing"


          git push





      # =========================
      # 微信推送链接
      # =========================

      - name: Send WeCom Text

        continue-on-error: true

        run: |


          curl --max-time 20 \
          --connect-timeout 10 \
          "${{ secrets.REPORT_WEBHOOK }}" \
          -H 'Content-Type: application/json' \
          -d '{

          "msgtype":"markdown",

          "markdown":{

          "content":

          "# 运动鞋服行业资讯日报\n\n\
          📌 日报：\n\
          https://yangyituo1231.github.io/Trendradar-sports-news/daily-report.html\n\n\
          📌 周报：\n\
          https://yangyituo1231.github.io/Trendradar-sports-news/weekly-report.html"

          }

          }'





      # =========================
      # 推送周报图片
      # =========================

      - name: Send WeCom Image

        continue-on-error: true

        env:

          REPORT_WEBHOOK: ${{ secrets.REPORT_WEBHOOK }}


        run: |

          python scripts/send_wecom_image.py
