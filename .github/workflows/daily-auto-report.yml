name: Daily Auto Report


on:

  schedule:

    # 北京时间每天8:00运行
    # UTC 0:00
    - cron: '27 19 * * *'


  workflow_dispatch:



env:

  TZ: Asia/Shanghai



permissions:

  contents: write



jobs:


  auto-report:


    runs-on: ubuntu-latest



    steps:



      # =========================
      # 拉取代码
      # =========================

      - name: Checkout repository

        uses: actions/checkout@v4



      # =========================
      # Python环境
      # =========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"




      # =========================
      # 安装依赖
      # =========================

      - name: Install dependencies

        run: |

          pip install \
            requests \
            beautifulsoup4 \
            pyyaml \
            lxml \
            pillow \
            playwright \
            openai \
            python-pptx \
            pandas




      # =========================
      # 周报图片环境
      # =========================

      - name: Install browser and fonts

        run: |

          sudo apt-get update


          sudo apt-get install -y \
            fonts-noto-cjk \
            fonts-wqy-zenhei \
            fontconfig


          sudo fc-cache -fv


          playwright install --with-deps chromium





      # =========================
      # 抓取数据
      # =========================


      - name: Fetch News

        run: |

          python scripts/get_hot_news.py




      - name: Fetch Weather

        run: |

          python scripts/get_weather.py





      # =========================
      # 日报生成
      # =========================


      - name: Generate Daily Report

        env:

          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |

          python scripts/fill_report.py






      # =========================
      # 周报数据
      # =========================


      - name: Generate Weekly Data

        run: |

          python scripts/generate_weekly.py





      - name: Generate Products Data

        run: |

          python scripts/get_products.py





      - name: Generate Product Signals

        run: |

          python scripts/get_product_signals.py






      - name: Analyze Weekly Data

        env:

          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |

          python scripts/analyze_weekly.py






      # =========================
      # 周报HTML
      # =========================


      - name: Generate Weekly HTML

        run: |

          python scripts/generate_weekly_html.py





      # =========================
      # 周报图片
      # =========================


      - name: Render Weekly Image

        run: |

          python scripts/render_weekly_report.py





      # =========================
      # 保存文件
      # =========================


      - name: Commit files

        run: |


          git config user.name github-actions


          git config user.email github-actions@github.com



          git add .



          git commit -m "auto update daily weekly report" || echo "nothing to commit"



          git push






      # =========================
      # 微信推送文字
      # =========================


      - name: Send WeCom Text

        continue-on-error: true


        run: |


          curl --max-time 20 \
          --connect-timeout 10 \
          "${{ secrets.REPORT_WEBHOOK }}" \
          -H 'Content-Type: application/json' \
          -d '{

            "msgtype":"markdown",

            "markdown":{

              "content":"# 运动鞋服行业资讯日报\n\n日报已自动更新。"

            }

          }'





      # =========================
      # 微信推送周报图片
      # =========================


      - name: Send WeCom Image

        continue-on-error: true


        env:

          REPORT_WEBHOOK: ${{ secrets.REPORT_WEBHOOK }}


        run: |


          python scripts/send_wecom_image.py
